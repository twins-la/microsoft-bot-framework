[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twins-microsoft-bot-framework"
version = "0.2.0"
description = "Microsoft Bot Framework digital twin for twins.la (channel + bot halves)"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4.0",
    "requests>=2.31,<3.0",
    "twins-local>=0.2.0",
    "PyJWT[crypto]>=2.8,<3.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["twins_microsoft_bot_framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
