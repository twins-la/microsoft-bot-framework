name: audit

# Audits the pinned dependency set for known vulnerabilities. The twin signs
# JWTs, so PyJWT / cryptography / requests drift is security-relevant; this
# keeps requirements.lock honest over time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Audit pinned dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock
