[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twins-microsoft-bot-framework-local"
version = "0.1.0"
description = "Local SQLite host for the Microsoft Bot Framework digital twin"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "twins-microsoft-bot-framework>=0.1.0",
    "twins-local>=0.2.0",
    "gunicorn>=22.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["twins_microsoft_bot_framework_local*"]
